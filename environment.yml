name: gigaseal
channels:
  - conda-forge
dependencies:
  - python=3.13.5
  - pip
  # Core scientific stack (faster via conda)
  - numpy>=1.21
  - pandas>=1.3
  - scipy>=1.7
  - matplotlib>=3.5
  - h5py
  # GUI dependencies (optional, comment out if not needed)
  - pyqtgraph
  - seaborn
  # Dev tools
  - ipython
  - jupyter
  - pytest
  - pip:
    - pyabf
    - ipfx>=2.1.0
    - prismWriter
    - anndata
    - flask
    - pyyaml
    - beautifulsoup4
    - openpyxl
    - scikit-learn
    - -e .
